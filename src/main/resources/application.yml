spring:
  application:
    name: factory-sandbox
  datasource:
    url: jdbc:h2:mem:sandbox;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate   # schema comes from Liquibase only
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
