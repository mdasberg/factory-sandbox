databaseChangeLog:
  - changeSet:
      id: 001-greeting
      author: factory
      changes:
        - createTable:
            tableName: greeting
            columns:
              - column: { name: id, type: bigint, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: varchar(200), constraints: { nullable: false } }
              - column: { name: text, type: varchar(400), constraints: { nullable: false } }
